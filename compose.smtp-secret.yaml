services:
  filius-contact:
    # node:24-alpine uses UID/GID 1000; keep this explicit so the host
    # secret ownership contract remains visible in the deployment override.
    user: "1000:1000"
    environment:
      CONTACT_SMTP_PASSWORD: ""
      CONTACT_SMTP_PASSWORD_FILE: /run/secrets/contact_smtp_password
    secrets:
      - contact_smtp_password

secrets:
  contact_smtp_password:
    file: ${CONTACT_SMTP_PASSWORD_SECRET_FILE:?Set CONTACT_SMTP_PASSWORD_SECRET_FILE to a readable host file outside Git}
