server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    # Keep directory canonicalization redirects relative. This container sits
    # behind Nginx Proxy Manager, so absolute redirects would otherwise expose
    # the internal http scheme and port 8080 to visitors.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Nginx Proxy Manager is the visitor-facing proxy and keeps the configured
    # rotating access log. Avoid a duplicate visitor log in this static origin.
    access_log off;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/manifest+json application/rss+xml application/xml image/svg+xml;

    location = /healthz {
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location = /analytics-config.json {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /api/contact {
        include /etc/nginx/snippets/security-headers.conf;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $contact_service http://filius-contact:3000;
        client_max_body_size 16k;
        proxy_http_version 1.1;
        proxy_pass $contact_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
        proxy_send_timeout 10s;
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /robots.txt {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /.well-known/security.txt {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(?:avif|gif|ico|jpe?g|png|svg|webp|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        internal;
        add_header Cache-Control "no-cache" always;
    }
}
