services:
  filius-web:
    image: ${FILIUS_IMAGE:-ghcr.io/OWNER/filius-app-website}:${FILIUS_IMAGE_TAG:-main}
    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      filius-contact:
        condition: service_healthy
    networks:
      - npm_proxy
      - contact_backend
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 128m
    cpus: "0.50"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  filius-contact:
    image: ${FILIUS_CONTACT_IMAGE:-ghcr.io/OWNER/filius-app-website-contact}:${FILIUS_IMAGE_TAG:-main}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      PORT: "3000"
      CONTACT_SMTP_HOST: ${CONTACT_SMTP_HOST:-provider-smtp.example.invalid}
      CONTACT_SMTP_PORT: ${CONTACT_SMTP_PORT:-465}
      CONTACT_SMTP_SECURE: ${CONTACT_SMTP_SECURE:-true}
      CONTACT_SMTP_USERNAME: ${CONTACT_SMTP_USERNAME:-deployment-mailbox@example.invalid}
      CONTACT_SMTP_PASSWORD: ${CONTACT_SMTP_PASSWORD:-}
      CONTACT_SMTP_PASSWORD_FILE: ${CONTACT_SMTP_PASSWORD_FILE:-}
      CONTACT_FROM_ADDRESS: ${CONTACT_FROM_ADDRESS:-deployment-mailbox@example.invalid}
      CONTACT_TO_ADDRESS: ${CONTACT_TO_ADDRESS:-support@filius.app}
      CONTACT_ALLOWED_ORIGINS: ${CONTACT_ALLOWED_ORIGINS:-https://filius.app,https://www.filius.app}
      CONTACT_RATE_LIMIT_MAX: ${CONTACT_RATE_LIMIT_MAX:-5}
      CONTACT_RATE_LIMIT_WINDOW_MINUTES: ${CONTACT_RATE_LIMIT_WINDOW_MINUTES:-15}
      CONTACT_RETENTION_DAYS: ${CONTACT_RETENTION_DAYS:-180}
    networks:
      - contact_backend
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 80
    mem_limit: 96m
    cpus: "0.35"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  npm_proxy:
    external: true
    name: ${NPM_NETWORK:-npm_default}
  contact_backend:
    driver: bridge
