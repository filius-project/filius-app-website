services:
  filius-web:
    image: ${FILIUS_IMAGE:-ghcr.io/OWNER/filius-app-website}:${FILIUS_IMAGE_TAG:-main}
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - npm_proxy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 128m
    cpus: "0.50"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  npm_proxy:
    external: true
    name: ${NPM_NETWORK:-npm_default}
