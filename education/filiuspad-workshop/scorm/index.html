<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FiliusPad Lernpfad</title><link rel="stylesheet" href="styles.css"><script>const MODULES=[{"id":"start","number":"0","title":"Startklar: Dein virtuelles Netz","goal":"Du kennst die beiden Arbeitsmodi, kannst ein Projekt speichern und weißt, wie du Beobachtungen dokumentierst.","concept":"FiliusPad trennt Entwurf und Aktion: Im Entwurfsmodus baust und konfigurierst du die Topologie. Im Aktionsmodus läuft die Simulation und du startest Anwendungen.","materials":["iPad mit FiliusPad","Dateien-App oder ein Lernordner","Stift oder Tastatur"],"steps":["Lege ein neues Projekt an. Verwende für alle Dateien das Schema <strong>JJMMTT-Aufgabe-Name</strong>, zum Beispiel <code>260805-01-Ada</code>.","Finde den Umschalter <strong>Entwurfsmodus / Aktionsmodus</strong> und öffne bei einem Rechner den Laufzeit-Arbeitsbereich.","Speichere das leere Projekt als <code>260805-00-Ada.fls</code>.","Notiere in deinem Heft: Was ist im Entwurf möglich, was erst in der Aktion?"],"observe":"Ein gutes Laborprotokoll enthält Topologie, Adressen, ausgeführte Befehle, Beobachtungen und eine kurze Erklärung.","deliverable":"Eine gespeicherte leere Projektdatei und eine Liste mit zwei Unterschieden zwischen den Modi.","questions":[["In welchem Modus startest du eine Simulation?","Aktionsmodus","Entwurfsmodus"],["Welche Endung hat eine FiliusPad-Projektdatei?",".fls",".moodle"]]},{"id":"peer","number":"1","title":"Zwei Rechner direkt verbinden","goal":"Du baust ein Peer-to-Peer-Netz und prüfst die Verbindung mit ping.","concept":"Zwei Geräte können direkt miteinander verbunden werden. Damit IPv4-Kommunikation funktioniert, müssen beide Adressen im selben Netz liegen und eindeutig sein.","materials":["Projekt aus Modul 0","Zwei Rechner oder Notebooks"],"steps":["Platziere zwei Rechner. Benenne sie <code>Rechner 10</code> und <code>Rechner 11</code>.","Verbinde die Rechner mit einem Kabel.","Setze <code>192.168.10.10</code> und <code>192.168.10.11</code> mit der Subnetzmaske <code>255.255.255.0</code>.","Starte die Simulation. Installiere auf Rechner 10 <strong>CMD</strong> und führe <code>ping 192.168.10.11</code> aus.","Öffne zusätzlich die Paket-/Datenaustauschansicht. Welche Nachrichten siehst du?"],"observe":"Beim ersten Ping kann vor der Echo-Anfrage eine Auflösung der Zieladresse sichtbar werden. Danach folgen Echo request und Echo reply.","deliverable":"Die Projektdatei, ein kurzer Ping-Nachweis und eine beschriftete Pfeilskizze Quelle → Ziel.","questions":[["Welche Bedingung muss für ein direktes IPv4-Netz gelten?","Gleicher Netzbereich und eindeutige Adressen","Jedes Gerät braucht eine öffentliche Internetadresse"],["Wofür steht eine Ping-Antwort?","Das Ziel hat die Anfrage beantwortet","Der Switch hat eine neue IP vergeben"]]},{"id":"switch","number":"2","title":"Ein Switch verbindet ein LAN","goal":"Du erweiterst das Netz, beobachtest Lernen von MAC-Adressen und erklärst LAN und Protokoll.","concept":"Ein Switch verbindet mehrere Geräte im selben lokalen Netz. Er lernt, an welchem Port eine Quell-MAC-Adresse erreichbar ist, und leitet Frames gezielter weiter.","materials":["Projekt aus Modul 1","Einen Switch und einen dritten Rechner"],"steps":["Platziere einen Switch und einen dritten Rechner namens <code>Server 12</code>.","Verbinde alle drei Rechner mit dem Switch. Lass die Adressen im Netz <code>192.168.10.0/24</code>.","Starte die Simulation und sende von Rechner 10 einen Ping an Rechner 12.","Sende danach von Rechner 11 einen Ping an Rechner 12. Vergleiche die Paketansichten.","Beschreibe, was im Alltag einem Switch entspricht, wenn man an ein Stromnetz denkt."],"observe":"Broadcasts können mehrere Ports erreichen; bekannte Ziele werden vom Switch gezielter weitergeleitet. Zeichne die beobachtete Richtung ein.","deliverable":"Eine beschriftete LAN-Topologie und drei Sätze zu Switch, LAN und Protokoll.","questions":[["Was ist ein LAN?","Ein lokales Rechnernetz","Ein einzelner Computer ohne Verbindung"],["Was beschreibt ein Protokoll?","Regeln für die Kommunikation","Die Farbe eines Netzwerkkabels"]]},{"id":"client-server","number":"3","title":"Client und Server","goal":"Du untersuchst einen Dienst und trennst Client, Serverprogramm und Servergerät.","concept":"Ein Client fordert einen Dienst an. Ein Serverprogramm bietet ihn an. Ein Computer wird oft ebenfalls Server genannt, wenn er solche Programme bereitstellt.","materials":["Projekt aus Modul 2","CMD, Echo-Server, Einfacher Client"],"steps":["Installiere auf <code>Server 12</code> den <strong>Echo-Server</strong> und starte ihn auf Port <code>55555</code>.","Installiere auf <code>Rechner 10</code> den <strong>Einfachen Client</strong> und verbinde ihn mit <code>192.168.10.12:55555</code>.","Sende drei Nachrichten. Beobachte Antwort, Quelle, Ziel und Port in der Paketansicht.","Erkläre mit eigenen Worten, was der Echo-Server leistet.","Übertrage das Prinzip auf Webserver, Dateiserver und Mailserver."],"observe":"Der Port unterscheidet den Dienst. Die IP-Adresse führt zum Gerät; der Port führt zum passenden Serverprogramm.","deliverable":"Ein Ablaufbild mit Anfrage und Antwort sowie eine Erklärung des Client-Server-Prinzips.","questions":[["Was identifiziert den Dienst auf einem Gerät?","Ein Port","Die Farbe des Geräts"],["Wer fordert beim Echo-Beispiel die Leistung an?","Der Client","Der Switch"]]},{"id":"router","number":"4","title":"Zwei Netze mit einem Router verbinden","goal":"Du unterscheidest Netzadresse, Gateway und Router und findest einen Konfigurationsfehler.","concept":"Ein Router verbindet unterschiedliche IP-Netze. Ein Gerät schickt Ziele außerhalb seines eigenen Netzes an das Standardgateway.","materials":["Projekt aus Modul 3","Router/Vermittlungsrechner, zweiter Switch, drei weitere Rechner"],"steps":["Baue ein zweites LAN mit <code>192.168.20.0/24</code> und den Geräten <code>Client 20</code> (<code>192.168.20.10</code>) und <code>Client 21</code> (<code>192.168.20.11</code>).","Platziere einen Router mit zwei Schnittstellen. Verwende <code>192.168.10.1</code> und <code>192.168.20.1</code>.","Teste aus dem ersten LAN einen Ping zu <code>192.168.20.10</code> ohne Gateway. Notiere das Ergebnis.","Setze das Gateway der Geräte im ersten LAN auf <code>192.168.10.1</code> und im zweiten LAN auf <code>192.168.20.1</code>.","Teste erneut und erkläre, warum sich das Ergebnis ändert."],"observe":"Ohne Gateway bleibt ein Ziel in einem fremden Netz unerreichbar. Mit Gateway kann der Router das Paket weiterleiten.","deliverable":"Zwei farbig markierte IP-Netze, Router-Adressen und ein Vorher-/Nachher-Vergleich.","questions":[["Wann wird das Standardgateway benötigt?","Für Ziele außerhalb des eigenen Netzes","Für jede Datei im selben Ordner"],["Was verbindet ein Router?","Verschiedene Netzwerke","Nur zwei Anwendungen auf demselben Gerät"]]},{"id":"web","number":"5","title":"Das eigene Web: Server und Browser","goal":"Du stellst eine lokale HTML-Seite bereit und rufst sie über den Webbrowser ab.","concept":"Der Webserver ist ein Dienst. Der Webbrowser ist sein Client. Eine Webseite besteht aus HTML und kann weitere Dateien anfordern.","materials":["Projekt aus Modul 4","Datei-Explorer, Texteditor, Webserver, Webbrowser"],"steps":["Installiere auf <code>Server 12</code> den <strong>Datei-Explorer</strong>, den <strong>Texteditor</strong> und den <strong>Webserver</strong>.","Öffne die vorhandene Datei <code>/www/index.html</code> im Texteditor und ersetze sie durch eine eigene Seite mit Überschrift, Absatz und Link.","Lege mit dem Datei-Explorer im Ordner <code>/www</code> zusätzlich <code>kontakt.html</code> an und bearbeite die Datei anschließend im Texteditor.","Starte den Webserver. Installiere auf <code>Client 20</code> den <strong>Webbrowser</strong>.","Öffne im Browser <code>http://192.168.10.12</code>. Beobachte die HTTP-Anfrage und -Antwort."],"observe":"Der Browser stellt eine Anfrage; der Webserver liefert Inhalt. Bei einer zweiten Seite entsteht eine weitere Anfrage.","deliverable":"Eine eigene Mini-Webseite und ein Sequenzdiagramm Browser → Webserver → Browser.","questions":[["Wer ist im Web-Beispiel der Client?","Der Webbrowser","Der Webserver"],["Welche Sprache beschreibt die Struktur einer Seite?","HTML","IPv4"]]},{"id":"dns","number":"6","title":"DNS: Namen statt Zahlen","goal":"Du richtest einen DNS-Eintrag ein und rufst die Webseite mit einem Namen auf.","concept":"DNS ordnet einen Hostnamen einer IP-Adresse zu. Der Browser kann dadurch einen Namen nutzen, obwohl die Kommunikation weiterhin eine IP-Adresse benötigt.","materials":["Projekt aus Modul 5","DNS-Server auf einem neuen Server im ersten LAN"],"steps":["Platziere <code>DNS 53</code> im ersten LAN mit <code>192.168.10.53</code> und Gateway <code>192.168.10.1</code>.","Trage bei den Rechnern den DNS-Server <code>192.168.10.53</code> ein.","Installiere und starte den <strong>DNS-Server</strong> auf DNS 53.","Lege den Eintrag <code>www.filius.test → 192.168.10.12</code> an.","Öffne im Browser <code>http://www.filius.test</code> und vergleiche die Anfrage mit dem direkten Aufruf über die IP-Adresse.","Markiere in <code>www.filius.test</code> Root, Top-Level-Domain, Second-Level-Domain und Hostname."],"observe":"Ohne DNS kann der direkte IP-Aufruf funktionieren, während der Name fehlschlägt. Mit dem Eintrag wird der Name aufgelöst.","deliverable":"Ein DNS-Diagramm und eine Tabelle mit mindestens drei Namen-IP-Zuordnungen.","questions":[["Was liefert DNS im Kern?","Eine Zuordnung von Name zu IP-Adresse","Eine neue Stromversorgung"],["Was bleibt beim DNS-Aufruf gleich?","Die Ziel-IP des Webservers nach der Auflösung","Die Tastatur des Clients"]]},{"id":"dhcp-packets","number":"7","title":"Automatik und Pakete","goal":"Du vergleichst feste Adressen mit DHCP und liest eine Paketfolge als technische Geschichte.","concept":"DHCP kann Netzwerkkonfiguration automatisch vergeben. Paketorientierte Übertragung zerlegt eine Kommunikation in einzelne Nachrichten mit Quelle, Ziel, Protokoll und Dienst.","materials":["Projekt aus Modul 6","DHCP-Server oder Paketansicht"],"steps":["Vergleiche eine fest eingetragene IP-Konfiguration mit einem DHCP-Client.","Richte einen DHCP-Server für <code>192.168.20.0/24</code> ein oder öffne die vorhandene DHCP-Funktion.","Aktiviere die automatische Konfiguration auf einem Client und notiere den erhaltenen Lease.","Lade die Webseite erneut und notiere mindestens fünf Paketzeilen: Quelle, Ziel, Protokoll oder Dienst, Beobachtung.","Erkläre, warum eine Datei nicht als ein einziger unteilbarer Block übertragen werden muss."],"observe":"Die Paketansicht macht die Kommunikation beobachtbar. Ein Fehler kann an Adresse, Gateway, DNS, Dienststatus oder Erreichbarkeit liegen.","deliverable":"Ein ausgefülltes Paketprotokoll und eine Fehlerdiagnose mit mindestens zwei überprüften Hypothesen.","questions":[["Was ist ein DHCP-Lease?","Eine zeitweise vergebene Netzwerkkonfiguration","Ein Webseitentitel"],["Was hilft bei der Fehlersuche?","Quelle, Ziel, Protokoll und Dienststatus prüfen","Alle Geräte zufällig umbenennen"]]},{"id":"capstone","number":"8","title":"Abschluss: Dein kleines Internet","goal":"Du planst, baust und erklärst eine eigene vernetzte Anwendung.","concept":"Ein Netz ist ein Zusammenspiel aus Geräten, Adressen, Weiterleitung, Namensauflösung und Anwendungen. Gute Netzplanung macht jeden Weg nachvollziehbar.","materials":["Die bisherigen Projektdateien","Skizzenpapier oder Notiz-App","FiliusPad"],"steps":["Plane zwei LANs mit mindestens vier Endgeräten, einem Switch, einem Router, einem DNS-Server und einem Webserver.","Lege einen Adressplan mit Netzmaske, Gateway und DNS fest.","Baue die Topologie in FiliusPad und speichere sie unter <code>260805-09-Abschluss-Name.fls</code>.","Beweise drei Dinge: Ping über den Router, Webzugriff über IP, Webzugriff über DNS-Namen.","Exportiere oder zeichne eine Dokumentation mit Topologie, Adressplan, Paketbeobachtung und Fehlerfall.","Schreibe eine Reflexion: Welche Konfiguration war notwendig, damit der Name bis zur Webseite führte?"],"observe":"Eine vollständige Erklärung folgt dem Weg: Name → DNS-IP → Gateway/Router → Zielnetz → Port/Dienst → Antwort.","deliverable":"Funktionierende Abschlussdatei, Netzplan, Adresstabelle und eine einseitige Erklärung.","questions":[["Welche Reihenfolge ist für einen Webaufruf mit DNS plausibel?","DNS-Auflösung, Routing, HTTP-Dienst, Antwort","Drucker, Tastatur, Akku, DNS"],["Was ist ein guter Abschlussnachweis?","Reproduzierbare Tests mit Ergebnis und Erklärung","Nur ein Screenshot ohne Kontext"]]}];</script></head><body><header><h1>FiliusPad: Rechnernetze selbst erkunden</h1><p>Selbstständiger Lernpfad für Klasse 8 · Bearbeitung auf dem iPad</p><div class="progress"><i id="progress"></i></div></header><div class="shell"><nav class="nav" aria-label="Module"></nav><main id="content"></main></div><script src="scorm.js"></script></body></html>
