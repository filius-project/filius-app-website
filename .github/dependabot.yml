version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:15"
      timezone: Europe/Berlin
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      development-tooling:
        dependency-type: development
    ignore:
      - dependency-name: typescript
        versions: [">=7.0.0"]

  - package-ecosystem: npm
    directory: /contact
    schedule:
      interval: weekly
      day: monday
      time: "03:20"
      timezone: Europe/Berlin

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Europe/Berlin
    ignore:
      - dependency-name: node
        versions: [">=26.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:45"
      timezone: Europe/Berlin
    groups:
      actions:
        patterns: ["*"]
