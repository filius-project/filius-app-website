name: Build website image

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: website-image-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix contact ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Validate static build
        run: npm run validate
      - name: Run test suite
        run: npm test
      - name: Verify Compose SMTP secret delivery
        run: npm run test:contact:compose

  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          pull: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            PUBLIC_UMAMI_SCRIPT_URL=${{ vars.UMAMI_SCRIPT_URL }}
            PUBLIC_UMAMI_WEBSITE_ID=${{ vars.UMAMI_WEBSITE_ID }}
            PUBLIC_UMAMI_DOMAINS=${{ vars.UMAMI_DOMAINS }}
            PUBLIC_LEGAL_CONTROLLER_NAME=${{ vars.LEGAL_CONTROLLER_NAME }}
            PUBLIC_LEGAL_CONTROLLER_ADDRESS=${{ vars.LEGAL_CONTROLLER_ADDRESS }}
            PUBLIC_LEGAL_CONTROLLER_EMAIL=${{ vars.LEGAL_CONTROLLER_EMAIL }}
            PUBLIC_LEGAL_CONTROLLER_PHONE=${{ vars.LEGAL_CONTROLLER_PHONE }}
            PUBLIC_LEGAL_VAT_ID=${{ vars.LEGAL_VAT_ID }}
            PUBLIC_LEGAL_REGISTER_ENTRY=${{ vars.LEGAL_REGISTER_ENTRY }}
            PUBLIC_HOSTING_PROVIDER_NAME=${{ vars.HOSTING_PROVIDER_NAME }}
            PUBLIC_HOSTING_PROVIDER_ADDRESS=${{ vars.HOSTING_PROVIDER_ADDRESS }}
            PUBLIC_HOSTING_COUNTRY=${{ vars.HOSTING_COUNTRY }}
            PUBLIC_HOSTING_REGION=${{ vars.HOSTING_REGION }}
            PUBLIC_CLOUDFLARE_PROXY_ENABLED=${{ vars.CLOUDFLARE_PROXY_ENABLED }}
            PUBLIC_ACCESS_LOG_RETENTION_DAYS=${{ vars.ACCESS_LOG_RETENTION_DAYS }}
            PUBLIC_ERROR_LOG_RETENTION_DAYS=${{ vars.ERROR_LOG_RETENTION_DAYS }}
            PUBLIC_SUPPORT_RETENTION_DAYS=${{ vars.SUPPORT_RETENTION_DAYS }}
            PUBLIC_CONTACT_RATE_LIMIT_WINDOW_MINUTES=${{ vars.CONTACT_RATE_LIMIT_WINDOW_MINUTES }}
            PUBLIC_ANALYTICS_RETENTION_DAYS=${{ vars.ANALYTICS_RETENTION_DAYS }}
            PUBLIC_PRIVACY_NOTICE_DATE=${{ vars.PRIVACY_NOTICE_DATE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build contact service without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: contact
          push: false
          pull: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=contact
          cache-to: type=gha,mode=max,scope=contact

  publish:
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=auto
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=scheduled,enable=${{ github.event_name == 'schedule' }}
      - name: Generate contact image metadata
        id: contact-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-contact
          flavor: latest=auto
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=scheduled,enable=${{ github.event_name == 'schedule' }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PUBLIC_UMAMI_SCRIPT_URL=${{ vars.UMAMI_SCRIPT_URL }}
            PUBLIC_UMAMI_WEBSITE_ID=${{ vars.UMAMI_WEBSITE_ID }}
            PUBLIC_UMAMI_DOMAINS=${{ vars.UMAMI_DOMAINS }}
            PUBLIC_LEGAL_CONTROLLER_NAME=${{ vars.LEGAL_CONTROLLER_NAME }}
            PUBLIC_LEGAL_CONTROLLER_ADDRESS=${{ vars.LEGAL_CONTROLLER_ADDRESS }}
            PUBLIC_LEGAL_CONTROLLER_EMAIL=${{ vars.LEGAL_CONTROLLER_EMAIL }}
            PUBLIC_LEGAL_CONTROLLER_PHONE=${{ vars.LEGAL_CONTROLLER_PHONE }}
            PUBLIC_LEGAL_VAT_ID=${{ vars.LEGAL_VAT_ID }}
            PUBLIC_LEGAL_REGISTER_ENTRY=${{ vars.LEGAL_REGISTER_ENTRY }}
            PUBLIC_HOSTING_PROVIDER_NAME=${{ vars.HOSTING_PROVIDER_NAME }}
            PUBLIC_HOSTING_PROVIDER_ADDRESS=${{ vars.HOSTING_PROVIDER_ADDRESS }}
            PUBLIC_HOSTING_COUNTRY=${{ vars.HOSTING_COUNTRY }}
            PUBLIC_HOSTING_REGION=${{ vars.HOSTING_REGION }}
            PUBLIC_CLOUDFLARE_PROXY_ENABLED=${{ vars.CLOUDFLARE_PROXY_ENABLED }}
            PUBLIC_ACCESS_LOG_RETENTION_DAYS=${{ vars.ACCESS_LOG_RETENTION_DAYS }}
            PUBLIC_ERROR_LOG_RETENTION_DAYS=${{ vars.ERROR_LOG_RETENTION_DAYS }}
            PUBLIC_SUPPORT_RETENTION_DAYS=${{ vars.SUPPORT_RETENTION_DAYS }}
            PUBLIC_CONTACT_RATE_LIMIT_WINDOW_MINUTES=${{ vars.CONTACT_RATE_LIMIT_WINDOW_MINUTES }}
            PUBLIC_ANALYTICS_RETENTION_DAYS=${{ vars.ANALYTICS_RETENTION_DAYS }}
            PUBLIC_PRIVACY_NOTICE_DATE=${{ vars.PRIVACY_NOTICE_DATE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Build and push contact service
        id: contact-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: contact
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.contact-meta.outputs.tags }}
          labels: ${{ steps.contact-meta.outputs.labels }}
          cache-from: type=gha,scope=contact
          cache-to: type=gha,mode=max,scope=contact
          provenance: mode=max
          sbom: true
      - name: Attest published image when supported
        if: github.event.repository.visibility == 'public' || vars.ENABLE_ARTIFACT_ATTESTATION == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Attest published contact image when supported
        if: github.event.repository.visibility == 'public' || vars.ENABLE_ARTIFACT_ATTESTATION == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-contact
          subject-digest: ${{ steps.contact-build.outputs.digest }}
          push-to-registry: true
      - name: Publish summary
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          CONTACT_IMAGE_TAGS: ${{ steps.contact-meta.outputs.tags }}
          CONTACT_IMAGE_DIGEST: ${{ steps.contact-build.outputs.digest }}
          ATTESTATION_ENABLED: ${{ github.event.repository.visibility == 'public' || vars.ENABLE_ARTIFACT_ATTESTATION == 'true' }}
        run: |
          {
            echo "### Published image"
            echo '```text'
            echo "$IMAGE_TAGS"
            echo '```'
            echo "Digest: \`$IMAGE_DIGEST\`"
            echo "### Published contact image"
            echo '```text'
            echo "$CONTACT_IMAGE_TAGS"
            echo '```'
            echo "Digest: \`$CONTACT_IMAGE_DIGEST\`"
            if [ "$ATTESTATION_ENABLED" = "true" ]; then
              echo "Artifact attestation: published"
            else
              echo "Artifact attestation: skipped (unsupported by this private repository)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
